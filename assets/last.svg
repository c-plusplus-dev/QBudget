
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="50"
    height="50"
    viewBox="0 0 50 50"
>
    <defs>
        <marker
            id="arrowhead"
            markerWidth="2.5"
            markerHeight="2.5"
            refX="1"
            refY="1.25"
            orient="auto"
        >
            <g transform="scale(0.24)">
                <path
                    d="M1 1 L10 5 L1 10 Z"
                    fill="#FFFFFF"
                    stroke="#FFFFFF"
                    stroke-linejoin="round"
                />
            </g>
        </marker>
    </defs>

    <!-- Left cube: three rounded chunks -->
    <g transform="translate(5, 17.65) scale(0.35)" fill="#FFFFFF">
        <rect x="0" y="0" width="44" height="13" rx="5" />
        <rect x="0" y="15.5" width="44" height="13" rx="5" />
        <rect x="0" y="31" width="44" height="13" rx="5" />
    </g>

    <!-- Right cube: three rounded chunks -->
    <g transform="translate(30.3, 17.65) scale(0.35)" fill="#FFFFFF">
        <rect x="0" y="0" width="44" height="13" rx="5" />
        <rect x="0" y="15.5" width="44" height="13" rx="5" />
        <rect x="0" y="31" width="44" height="13" rx="5" />
    </g>

    <!-- Arrow -->
    <path
        d="M21 17 Q25 13 29 17"
        fill="none"
        stroke="#FFFFFF"
        stroke-linecap="round"
        stroke-width="1"
        marker-end="url(#arrowhead)"
    />
</svg>
